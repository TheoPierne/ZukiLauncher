appId: 'com.wouhait.zukipalacelauncher'
productName: 'ZukiPalace Launcher'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2024 Théo Pierné'

asar: true
compression: 'maximum'

# Everything in the project folder is packaged unless excluded here: never ship
# local secrets (.env, keys), archives or the maintainer scripts.
files:
  - '!{dist,.gitignore,.vscode,docs,scripts,dev-app-update.yml,.nvmrc,.eslintrc.json,.env,.env.*,*.zip,*.pem,eslint.config.*}'

extraResources:
  - 'libraries'

# Windows Configuration
# Code signing: only use a certificate trusted by Windows (Azure Trusted Signing
# "Public Trust", OV/EV certificate...). Once win.azureSignOptions.publisherName
# (or signtoolOptions.publisherName) is set, electron-updater refuses any update
# whose signature is not valid on the player's PC or whose certificate name
# differs. A "Private Trust" certificate is not trusted on players' PCs and
# would block every update.
win:
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'
  extendInfo:
    NSMicrophoneUsageDescription: 'Un mod Minecraft veut accéder à votre microphone.'
    NSHighResolutionCapable: true

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Théo Pierné'
  vendor: 'Théo Pierné'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'